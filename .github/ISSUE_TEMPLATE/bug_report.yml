name: Bug report
description: Report a reproducible problem in CHAOSOS.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: input
    id: version
    attributes:
      label: CHAOSOS version
      placeholder: "3.1.6"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, OS, browser, or WebView
      placeholder: "Android version / device / browser"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Direct negative criticism is welcome. Explain the actual problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open... 2. Tap... 3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
      description: Optional, but useful.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
    validations:
      required: false
